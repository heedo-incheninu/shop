name = "shop"
main = "src/worker.js"
compatibility_date = "2026-08-29"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "shop-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "./migrations"
